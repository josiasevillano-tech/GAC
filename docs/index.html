<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela del Pensamiento - Guia Semanal</title>
    <style>
        :root {
            --color-primario: #2c5282;
            --color-secundario: #3182ce;
            --color-fondo: #f5f7fa;
            --color-texto: #2d3748;
            --sombra: 0 2px 8px rgba(0,0,0,0.08);
            --radio: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .contenedor { max-width: 600px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--color-primario);
        }
        header h1 {
            font-size: 1.6rem;
            color: var(--color-primario);
            margin-bottom: 6px;
        }
        header p {
            color: #718096;
            font-size: 0.95rem;
        }
        .semana {
            background: white;
            padding: 20px;
            border-radius: var(--radio);
            box-shadow: var(--sombra);
            margin-bottom: 24px;
        }
        .semana h2 {
            font-size: 1.1rem;
            color: var(--color-primario);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .crucigrama-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .crucigrama-card:hover {
            border-color: var(--color-secundario);
            transform: translateY(-2px);
        }
        .crucigrama-info h3 {
            font-size: 1rem;
            color: var(--color-texto);
            margin-bottom: 4px;
        }
        .crucigrama-info .tema {
            font-size: 0.85rem;
            color: #718096;
        }
        .btn-jugar {
            background: var(--color-primario);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-jugar:hover { background: var(--color-secundario); }
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #a0aec0;
        }
        .whatsapp-share {
            background: #25d366;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }
        .whatsapp-share:hover { background: #128c7e; }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Escuela del Pensamiento</h1>
            <p>Guia semanal de crucigramas educativos</p>
        </header>

        <div class="semana">
            <h2>Semana actual</h2>

            <div class="crucigrama-card">
                <div class="crucigrama-info">
                    <h3>Lunes: Libros del Nuevo Testamento</h3>
                    <div class="tema">Historia Biblica</div>
                </div>
                <a href="crucigrama_web.html" class="btn-jugar">Jugar</a>
            </div>

            <!-- Cuando generes mas crucigramas, copia este bloque y cambia los datos -->
            <!--
            <div class="crucigrama-card">
                <div class="crucigrama-info">
                    <h3>Martes: [Titulo]</h3>
                    <div class="tema">[Tema]</div>
                </div>
                <a href="crucigrama_2.html" class="btn-jugar">Jugar</a>
            </div>
            -->
        </div>

        <div style="text-align: center;">
            <p style="color: #718096; font-size: 0.9rem; margin-bottom: 12px;">
                Comparte esta guia con tus estudiantes:
            </p>
            <a id="share-link" href="#" class="whatsapp-share" onclick="compartirWhatsApp(event)">
                Compartir por WhatsApp
            </a>
        </div>

        <footer>
            Escuela del Pensamiento - Generado con GAC
        </footer>
    </div>

    <script>
        function compartirWhatsApp(e) {
            e.preventDefault();
            var url = window.location.href;
            var texto = "Hola! Te comparto la guia semanal de crucigramas de la Escuela del Pensamiento: " + url;
            var waLink = "https://wa.me/?text=" + encodeURIComponent(texto);
            window.open(waLink, '_blank');
        }
    </script>
</body>
</html>
